<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Vu et Être Vu — Auto-école Chablais</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{--bg:#111C3C;--card:#1A2B5C;--card2:#0D1530;--gold:#C4913A;
      --green:#2A6B42;--red:#A83232;--white:#FFFFFF;--light:#B8C5D6;--muted:#6E85A3;--blue:#2E5BA6}
body{font-family:'Segoe UI',Arial,sans-serif;background:var(--bg);color:var(--white);
     min-height:100vh;overflow-x:hidden}
.page{display:none;flex-direction:column;align-items:center;justify-content:center;
      min-height:100vh;padding:20px 16px 36px;gap:14px;max-width:680px;margin:0 auto}
.page.on{display:flex}
.w-title{font-size:clamp(42px,11vw,74px);font-weight:900;color:var(--gold);text-align:center;line-height:.92}
.w-sub{font-size:14px;color:var(--light);max-width:380px;line-height:1.65;text-align:center}
.w-pills{display:flex;flex-wrap:wrap;gap:7px;justify-content:center}
.pill{background:rgba(196,145,58,.12);border:1px solid rgba(196,145,58,.3);border-radius:20px;
      padding:4px 13px;font-size:12px;color:var(--gold);font-weight:700}
.btn-main{background:linear-gradient(135deg,var(--gold),#8B6520);color:#fff;border:none;
          border-radius:10px;padding:15px 44px;font-size:16px;font-weight:700;
          cursor:pointer;font-family:inherit;margin-top:6px;transition:transform .15s}
.btn-main:hover{transform:translateY(-2px)}
#p-cover{text-align:center}
.cv-badge{display:inline-block;background:rgba(196,145,58,.12);border:1px solid rgba(196,145,58,.3);
          border-radius:20px;padding:4px 14px;font-size:11px;font-weight:800;
          letter-spacing:2px;text-transform:uppercase;color:var(--gold);margin-bottom:12px}
.cv-title{font-size:36px;font-weight:900;color:var(--white);margin:6px 0}
.cv-desc{font-size:14px;color:var(--light);font-weight:600;line-height:1.65;max-width:380px}
.btn-go{background:var(--card);border:1.5px solid rgba(255,255,255,.15);border-radius:10px;
        padding:12px 32px;font-size:15px;font-weight:700;color:var(--white);
        cursor:pointer;font-family:inherit;margin-top:10px;transition:all .2s}
.btn-go:hover{border-color:var(--gold);color:var(--gold)}
.prog{width:100%}
.prog-top{display:flex;justify-content:space-between;font-size:12px;font-weight:700;
          color:var(--muted);margin-bottom:5px}
.prog-bar{height:5px;background:rgba(255,255,255,.08);border-radius:3px;overflow:hidden}
.prog-fill{height:100%;background:linear-gradient(90deg,var(--blue),var(--gold));border-radius:3px;transition:width .5s;width:0%}
#p-qcm{justify-content:flex-start;padding-top:20px}
.q-label{background:rgba(196,145,58,.12);border:1px solid rgba(196,145,58,.25);color:var(--gold);
         border-radius:20px;padding:3px 13px;font-size:11px;font-weight:800;letter-spacing:1.5px;
         text-transform:uppercase;align-self:flex-start}
.q-text{font-size:clamp(14px,3.5vw,18px);font-weight:700;line-height:1.45;width:100%}
.q-choices{display:grid;gap:9px;width:100%}
.choice{background:rgba(255,255,255,.04);border:1.5px solid rgba(255,255,255,.1);border-radius:10px;
        padding:12px 15px;font-size:14px;font-weight:600;color:var(--white);cursor:pointer;
        text-align:left;font-family:inherit;display:flex;align-items:center;gap:11px;transition:all .18s}
.choice .L{width:24px;height:24px;border-radius:6px;background:rgba(255,255,255,.08);
           border:1px solid rgba(255,255,255,.15);display:flex;align-items:center;
           justify-content:center;font-size:11px;font-weight:800;flex-shrink:0}
.choice:hover:not(:disabled){background:rgba(255,255,255,.08);transform:translateX(3px)}
.choice.ok{background:rgba(42,107,66,.2);border-color:var(--green)}
.choice.ok .L{background:var(--green);color:#fff;border-color:var(--green)}
.choice.ko{background:rgba(168,50,50,.15);border-color:var(--red)}
.choice.ko .L{background:var(--red);color:#fff;border-color:var(--red)}
.choice:disabled{cursor:default}
.fb{display:none;border-radius:10px;padding:12px 15px;font-size:13px;line-height:1.6;
    font-weight:600;border:1.5px solid;width:100%}
.fb.ok{background:rgba(42,107,66,.12);border-color:var(--green);display:block}
.fb.ko{background:rgba(168,50,50,.1);border-color:var(--red);display:block}
.fb-h{font-size:14px;font-weight:800;margin-bottom:4px}
.fb.ok .fb-h{color:#4ade80}.fb.ko .fb-h{color:#f87171}
.fb-ref{margin-top:5px;padding-top:5px;border-top:1px solid rgba(255,255,255,.08);
        font-size:10px;color:var(--muted);font-style:italic}
#p-vf{justify-content:flex-start;padding-top:20px}
.vf-stmt{background:var(--card);border:1px solid rgba(255,255,255,.08);border-radius:12px;
         padding:22px 18px;font-size:16px;font-weight:700;line-height:1.45;
         text-align:center;width:100%;min-height:85px;display:flex;align-items:center;justify-content:center}
.vf-btns{display:grid;grid-template-columns:1fr 1fr;gap:12px;width:100%}
.vf-btn{border:none;border-radius:12px;padding:16px;font-size:22px;font-weight:800;
        cursor:pointer;font-family:inherit;transition:all .18s;display:flex;flex-direction:column;align-items:center;gap:3px}
.vf-btn span{font-size:11px;font-weight:800}
.vf-v{background:rgba(42,107,66,.15);border:2px solid var(--green);color:#4ade80}
.vf-f{background:rgba(168,50,50,.15);border:2px solid var(--red);color:#f87171}
.vf-v:hover:not(:disabled){background:rgba(42,107,66,.3);transform:scale(1.03)}
.vf-f:hover:not(:disabled){background:rgba(168,50,50,.3);transform:scale(1.03)}
.vf-btn:disabled{opacity:.5;cursor:default;transform:none!important}
.vf-ok{background:rgba(42,107,66,.4)!important;border-color:#4ade80!important}
.vf-ko{background:rgba(168,50,50,.4)!important;border-color:#f87171!important}
.btn-next{display:none;background:var(--card);border:1.5px solid rgba(255,255,255,.15);
          border-radius:10px;padding:11px 26px;font-size:14px;font-weight:700;
          color:var(--white);cursor:pointer;font-family:inherit;align-self:flex-end;transition:all .2s}
.btn-next:hover{border-color:var(--gold);color:var(--gold)}
.btn-next.show{display:block}
#p-id{justify-content:flex-start;padding-top:16px}
.id-view-lbl{font-size:11px;font-weight:800;letter-spacing:2px;text-transform:uppercase;
             color:var(--gold);background:rgba(196,145,58,.12);border:1px solid rgba(196,145,58,.3);
             border-radius:20px;padding:3px 14px;align-self:flex-start}
.car-wrap{position:relative;width:100%;background:#fff;border-radius:12px;overflow:hidden;
          box-shadow:0 4px 24px rgba(0,0,0,.4);border:1px solid rgba(255,255,255,.1)}
.car-img{width:100%;display:block}
.hot-dot{position:absolute;width:30px;height:30px;border-radius:50%;
         background:rgba(196,145,58,.25);border:3px solid #C4913A;
         transform:translate(-50%,-50%);pointer-events:none;
         animation:pulse 1.4s ease-in-out infinite}
@keyframes pulse{0%,100%{box-shadow:0 0 0 0 rgba(196,145,58,.6)}50%{box-shadow:0 0 0 12px rgba(196,145,58,0)}}
.id-choices{display:grid;grid-template-columns:1fr 1fr;gap:9px;width:100%}
.id-choice{background:rgba(255,255,255,.04);border:1.5px solid rgba(255,255,255,.12);
           border-radius:10px;padding:12px 10px;font-size:clamp(12px,2.8vw,14px);font-weight:600;
           color:var(--white);cursor:pointer;text-align:center;font-family:inherit;transition:all .18s}
.id-choice:hover:not(:disabled){background:rgba(255,255,255,.08);border-color:rgba(255,255,255,.3)}
.id-choice.ok{background:rgba(42,107,66,.2);border-color:var(--green);pointer-events:none}
.id-choice.ko{background:rgba(168,50,50,.15);border-color:var(--red);pointer-events:none}
#p-results{text-align:center}
.res-icon{font-size:22px;background:var(--gold);color:#000;border-radius:50%;
          width:68px;height:68px;display:flex;align-items:center;justify-content:center;
          margin:0 auto 8px;font-weight:900;box-shadow:0 0 20px rgba(196,145,58,.5);animation:popin .5s ease}
@keyframes popin{0%{transform:scale(0)}60%{transform:scale(1.1)}100%{transform:scale(1)}}
.res-title{font-size:38px;font-weight:900;color:var(--gold)}
.score-box{background:var(--card);border:1px solid rgba(255,255,255,.08);border-radius:14px;padding:14px 38px}
.score-num{font-size:54px;font-weight:900;color:var(--gold);line-height:1}
.score-lbl{font-size:10px;color:var(--muted);font-weight:700;text-transform:uppercase;letter-spacing:.5px}
.badge{border-radius:10px;padding:7px 20px;font-size:14px;font-weight:800;display:inline-block}
.bg{background:linear-gradient(135deg,#C4913A,#8B6520);color:#fff}
.bs{background:linear-gradient(135deg,#64748b,#475569);color:#fff}
.bb{background:linear-gradient(135deg,#cd7f32,#7c3a0b);color:#fff}
.br{background:linear-gradient(135deg,#A83232,#6b1f1f);color:#fff}
.res-msg{font-size:13px;color:var(--light);max-width:340px;line-height:1.65}
.res-stats{display:grid;grid-template-columns:1fr 1fr 1fr;gap:9px;width:100%}
.rs{background:var(--card);border:1px solid rgba(255,255,255,.08);border-radius:10px;padding:11px;text-align:center}
.rsv{font-size:22px;font-weight:900;color:var(--gold)}
.rsl{font-size:9px;color:var(--muted);font-weight:700;text-transform:uppercase;margin-top:2px}
.btn-retry{background:transparent;border:1.5px solid rgba(255,255,255,.15);border-radius:10px;
           padding:10px 22px;color:var(--muted);font-size:13px;font-weight:700;
           cursor:pointer;font-family:inherit;transition:all .2s}
.btn-retry:hover{border-color:var(--gold);color:var(--gold)}
</style>
</head>
<body>

<div id="p-welcome" class="page on">
  <div class="w-title">VU ET<br>ÊTRE VU</div>
  <p class="w-sub">Éclairage du véhicule — 3 exercices basés sur la LCR, l'OCR et l'OETV.</p>
  <div class="w-pills">
    <span class="pill">Auto-école Chablais</span>
    <span class="pill">LCR / OCR / OETV</span>
    <span class="pill">24 questions</span>
  </div>
  <button class="btn-main" onclick="showCover(0)">Commencer</button>
</div>

<div id="p-cover" class="page">
  <div class="cv-badge" id="cv-badge"></div>
  <div class="cv-title" id="cv-title"></div>
  <p class="cv-desc" id="cv-desc"></p>
  <button class="btn-go" onclick="startEx()">Commencer</button>
</div>

<div id="p-qcm" class="page">
  <div class="prog">
    <div class="prog-top"><span id="qn">1/6</span><span id="qs">Score : 0</span></div>
    <div class="prog-bar"><div class="prog-fill" id="qf"></div></div>
  </div>
  <div class="q-label">QCM</div>
  <div class="q-text" id="qt"></div>
  <div class="q-choices" id="qch"></div>
  <div class="fb" id="qfb"><div class="fb-h" id="qfbh"></div><div id="qfbb"></div><div class="fb-ref" id="qfbr"></div></div>
  <button class="btn-next" id="qnxt" onclick="nextQCM()">Question suivante</button>
</div>

<div id="p-vf" class="page">
  <div class="prog">
    <div class="prog-top"><span id="vn">1/6</span><span id="vs">Score : 0</span></div>
    <div class="prog-bar"><div class="prog-fill" id="vf2"></div></div>
  </div>
  <div class="q-label" style="align-self:flex-start">VRAI OU FAUX</div>
  <div class="vf-stmt" id="vt"></div>
  <div class="vf-btns">
    <button class="vf-btn vf-v" id="vbv" onclick="ansVF(true)">V<span>VRAI</span></button>
    <button class="vf-btn vf-f" id="vbf" onclick="ansVF(false)">F<span>FAUX</span></button>
  </div>
  <div class="fb" id="vfb"><div class="fb-h" id="vfbh"></div><div id="vfbb"></div><div class="fb-ref" id="vfbr"></div></div>
  <button class="btn-next" id="vnxt" onclick="nextVF()">Suivant</button>
</div>

<div id="p-id" class="page">
  <div class="prog">
    <div class="prog-top">
      <span class="id-view-lbl" id="id-view-lbl">VUE AVANT</span>
      <span id="ids">Score : 0</span>
    </div>
    <div class="prog-top" style="margin-top:3px"><span id="idn">1/12</span><span></span></div>
    <div class="prog-bar"><div class="prog-fill" id="idf"></div></div>
  </div>
  <div class="car-wrap" id="car-wrap-id"></div>
  <div class="id-choices" id="idch"></div>
  <div class="fb" id="idfb"><div class="fb-h" id="idfbh"></div><div id="idfbb"></div><div class="fb-ref" id="idfbr"></div></div>
  <button class="btn-next" id="idnxt" onclick="nextID()">Feu suivant</button>
</div>

<div id="p-results" class="page">
  <div class="res-icon" id="ri">A</div>
  <div class="res-title" id="rt"></div>
  <div class="score-box">
    <div class="score-num" id="rn"></div>
    <div class="score-lbl">POINTS CORRECTS</div>
  </div>
  <div class="badge" id="rb"></div>
  <p class="res-msg" id="rm"></p>
  <div class="res-stats">
    <div class="rs"><div class="rsv" id="rok">0</div><div class="rsl">Corrects</div></div>
    <div class="rs"><div class="rsv" id="rko">0</div><div class="rsl">Ratés</div></div>
    <div class="rs"><div class="rsv" id="rpc">0%</div><div class="rsl">Réussite</div></div>
  </div>
  <button class="btn-retry" onclick="restart()">Recommencer</button>
</div>

<script>

const COVERS=[{"badge": "EXERCICE 1 / 3", "title": "QCM", "desc": "6 questions à choix multiple. Une seule bonne réponse par question."}, {"badge": "EXERCICE 2 / 3", "title": "Vrai ou Faux", "desc": "6 affirmations sur les règles d'éclairage. Justification fournie après chaque réponse."}, {"badge": "EXERCICE 3 / 3", "title": "Identifier les feux", "desc": "12 feux à nommer. Le cercle doré indique le feu concerné sur le schéma. Choisissez le bon nom."}];
const QCM=[{"q": "La nuit ou dans un tunnel, quel éclairage est obligatoire ?", "ch": ["Feux de position uniquement", "Feux de croisement ou de route", "Feux de brouillard uniquement", "Aucun si la route est éclairée"], "ok": 1, "good": "Feux de croisement ou de route obligatoires la nuit et en tunnel.", "bad": "La nuit et en tunnel, les feux de croisement ou de route sont obligatoires.", "ref": "OCR art. 29 al. 1"}, {"q": "Quelle est la couleur réglementaire des feux de position avant ?", "ch": ["Rouge", "Orange", "Blanc ou jaune", "Bleu"], "ok": 2, "good": "Les feux de position avant sont blancs ou jaunes — OETV art. 72.", "bad": "Blanc ou jaune à l'avant, rouge réservé à l'arrière — OETV art. 72.", "ref": "OETV art. 72"}, {"q": "Les feux de brouillard avant sont-ils obligatoires en Suisse ?", "ch": ["Oui, depuis 2010", "Non, ils sont facultatifs", "Oui, la nuit uniquement", "Non, ils sont interdits"], "ok": 1, "good": "Les feux de brouillard avant sont facultatifs — OETV art. 78a.", "bad": "Les feux de brouillard avant sont facultatifs, non exigés par la loi.", "ref": "OETV art. 78a"}, {"q": "Quand le feu de brouillard arrière est-il autorisé ?", "ch": ["Dès qu'il pleut", "La nuit sur autoroute", "Lorsque la visibilité est fortement réduite", "Toujours en hiver"], "ok": 2, "good": "Autorisé uniquement si la visibilité est fortement réduite (brouillard, neige).", "bad": "Pas par simple pluie. Uniquement si visibilité fortement réduite.", "ref": "OCR art. 29"}, {"q": "Que dit l'OCR art. 29 al. 2 sur les feux de route ?", "ch": ["Toujours autorisés sur route cantonale", "Interdits dès qu'ils éblouissent un autre usager", "Obligatoires en permanence la nuit", "Aucune règle précise"], "ok": 1, "good": "Interdits dès qu'ils éblouissent — passer immédiatement aux feux de croisement.", "bad": "L'OCR art. 29 al. 2 interdit les feux de route dès qu'ils éblouissent.", "ref": "OCR art. 29 al. 2"}, {"q": "Qui est responsable du bon état des feux du véhicule ?", "ch": ["Le garage lors du dernier service", "Le constructeur", "Le conducteur et le détenteur", "L'assurance"], "ok": 2, "good": "Le conducteur et le détenteur sont responsables — LCR art. 29.", "bad": "LCR art. 29 et OETV art. 57 : conducteur et détenteur sont responsables.", "ref": "LCR art. 29 / OETV art. 57"}];
const VF=[{"txt": "De jour en agglomération, les feux de position sont suffisants.", "ok": true, "good": "Vrai — feux de position suffisants de jour en agglomération.", "bad": "C'est VRAI. De jour en agglomération, les feux de position suffisent.", "ref": "OCR art. 29"}, {"txt": "Les feux de route restent autorisés même si un piéton est ébloui.", "ok": false, "good": "Faux — interdits dès qu'ils éblouissent n'importe quel usager, y compris les piétons.", "bad": "FAUX. Interdits dès qu'ils éblouissent, y compris les piétons.", "ref": "OCR art. 29 al. 2"}, {"txt": "Le feu de brouillard arrière est obligatoire comme équipement sur tout véhicule.", "ok": true, "good": "Vrai — obligatoire comme équipement (OETV art. 78). Son usage est limité.", "bad": "C'est VRAI. Obligatoire comme équipement — son usage est limité.", "ref": "OETV art. 78"}, {"txt": "Le feu de brouillard arrière peut s'utiliser par simple pluie.", "ok": false, "good": "Faux — uniquement si visibilité fortement réduite (brouillard dense, neige épaisse).", "bad": "FAUX. Par simple pluie, la visibilité n'est pas fortement réduite.", "ref": "OCR art. 29"}, {"txt": "Les feux stop sont obligatoires sur tout véhicule à moteur.", "ok": true, "good": "Vrai — feux stop obligatoires selon OETV art. 76.", "bad": "C'est VRAI. Les feux stop sont obligatoires (OETV art. 76).", "ref": "OETV art. 76"}, {"txt": "Les feux de jour (DRL) remplacent les feux de croisement la nuit.", "ok": false, "good": "Faux — les DRL sont uniquement pour la visibilité de jour. Les feux de croisement restent obligatoires la nuit.", "bad": "FAUX. Les DRL ne remplacent pas les feux de croisement.", "ref": "OETV art. 72a"}];
const ID_Q=[{"img": "front", "label": "feux de position", "dot": {"x": 37, "y": 13}, "ref": "OETV art. 72", "expl": "Les feux de position signalent la présence du véhicule. Obligatoires — couleur blanche ou jaune."}, {"img": "front", "label": "feux de croisement", "dot": {"x": 38, "y": 26}, "ref": "OETV art. 74", "expl": "Les feux de croisement sont l'éclairage standard de nuit. Portée ~60 m. Obligatoires."}, {"img": "front", "label": "feux diurnes", "dot": {"x": 36, "y": 31}, "ref": "OETV art. 72a", "expl": "Les feux diurnes (DRL) augmentent la visibilité de jour. Facultatifs — automatiques au démarrage."}, {"img": "front", "label": "feux de route", "dot": {"x": 62, "y": 21}, "ref": "OETV art. 74", "expl": "Les feux de route ont une portée ~120 m. Interdits dès qu'ils éblouissent — OCR art. 29 al. 2."}, {"img": "front", "label": "clignotant", "dot": {"x": 63, "y": 31}, "ref": "OETV art. 79", "expl": "Les clignotants sont obligatoires à l'avant et à l'arrière. Signalent tout changement de direction."}, {"img": "front", "label": "clignotant latéral", "dot": {"x": 64, "y": 60}, "ref": "OETV art. 79", "expl": "Le clignotant latéral améliore la visibilité lors des changements de direction."}, {"img": "rear", "label": "feu rouge / feu STOP", "dot": {"x": 34, "y": 49}, "ref": "OETV art. 76", "expl": "Les feux stop s'allument automatiquement à chaque freinage. Obligatoires — couleur rouge vif."}, {"img": "rear", "label": "clignotant", "dot": {"x": 37, "y": 60}, "ref": "OETV art. 79", "expl": "Le clignotant arrière signale tout changement de direction. Obligatoire — couleur orange."}, {"img": "rear", "label": "troisième feu STOP", "dot": {"x": 51, "y": 48}, "ref": "OETV art. 76", "expl": "Le troisième feu STOP est le feu central en hauteur — renforce la visibilité du freinage."}, {"img": "rear", "label": "feux de recul", "dot": {"x": 60, "y": 60}, "ref": "OETV art. 77", "expl": "Le feu de recul est blanc, il s'allume automatiquement lors de la marche arrière."}, {"img": "rear", "label": "feux de brouillard", "dot": {"x": 63, "y": 67}, "ref": "OETV art. 78", "expl": "Le feu de brouillard AR est rouge. Usage uniquement si visibilité fortement réduite — OCR art. 29."}, {"img": "rear", "label": "éclairage plaque immatriculation", "dot": {"x": 49, "y": 72}, "ref": "OETV art. 73", "expl": "L'éclairage de la plaque est obligatoire — couleur blanche, s'allume avec les feux de position."}];
const FRONT_LABELS=["feux de position", "feux de croisement", "feux diurnes", "feux de route", "clignotant", "clignotant latéral"];

function show(id){document.querySelectorAll('.page').forEach(p=>p.classList.remove('on'));
  document.getElementById(id).classList.add('on');window.scrollTo(0,0);}
function showCover(n){exo=n;var c=COVERS[n];
  document.getElementById('cv-badge').textContent=c.badge;
  document.getElementById('cv-title').textContent=c.title;
  document.getElementById('cv-desc').textContent=c.desc;
  show('p-cover');}
function startEx(){
  if(exo===0){qi=0;show('p-qcm');renderQCM();}
  else if(exo===1){vi=0;show('p-vf');renderVF();}
  else{
    var fi=[],ri=[];
    ID_Q.forEach(function(q,i){if(q.img==='front')fi.push(i);else ri.push(i);});
    fi.sort(function(){return Math.random()-.5;});
    ri.sort(function(){return Math.random()-.5;});
    idOrder=fi.concat(ri);ii=0;show('p-id');renderID();
  }
}
function restart(){qi=0;vi=0;ii=0;score=0;correct=0;total=0;showCover(0);}

function renderQCM(){
  var q=QCM[qi];
  document.getElementById('qn').textContent='Question '+(qi+1)+'/'+QCM.length;
  document.getElementById('qf').style.width=(qi/QCM.length*100)+'%';
  document.getElementById('qt').textContent=q.q;
  document.getElementById('qfb').className='fb';
  document.getElementById('qnxt').classList.remove('show');
  var w=document.getElementById('qch');w.innerHTML='';
  ['A','B','C','D'].forEach(function(L,i){
    var b=document.createElement('button');b.className='choice';
    b.innerHTML='<span class="L">'+L+'</span>'+q.ch[i];
    b.onclick=function(){ansQCM(i,q,b);};w.appendChild(b);
  });
}
function ansQCM(chosen,q,btn){
  document.querySelectorAll('.choice').forEach(function(b){b.disabled=true;});
  var ok=chosen===q.ok;
  if(ok){btn.classList.add('ok');score++;correct++;}
  else{btn.classList.add('ko');document.querySelectorAll('.choice')[q.ok].classList.add('ok');}
  total++;document.getElementById('qs').textContent='Score : '+score;
  var fb=document.getElementById('qfb');fb.className='fb '+(ok?'ok':'ko');
  document.getElementById('qfbh').textContent=ok?'Bonne réponse !':'Pas tout à fait...';
  document.getElementById('qfbb').textContent=ok?q.good:q.bad;
  document.getElementById('qfbr').textContent=q.ref;
  document.getElementById('qnxt').classList.add('show');
}
function nextQCM(){qi++;if(qi>=QCM.length)showCover(1);else renderQCM();}

function renderVF(){
  var q=VF[vi];
  document.getElementById('vn').textContent='Affirmation '+(vi+1)+'/'+VF.length;
  document.getElementById('vf2').style.width=(vi/VF.length*100)+'%';
  document.getElementById('vt').textContent=q.txt;
  document.getElementById('vfb').className='fb';
  document.getElementById('vnxt').classList.remove('show');
  document.getElementById('vbv').disabled=false;document.getElementById('vbf').disabled=false;
  document.getElementById('vbv').className='vf-btn vf-v';
  document.getElementById('vbf').className='vf-btn vf-f';
}
function ansVF(ans){
  var q=VF[vi];var ok=ans===q.ok;
  document.getElementById('vbv').disabled=true;document.getElementById('vbf').disabled=true;
  document.getElementById(ans?'vbv':'vbf').classList.add(ok?'vf-ok':'vf-ko');
  if(!ok){document.getElementById(q.ok?'vbv':'vbf').classList.add('vf-ok');}
  if(ok){score++;correct++;}total++;
  document.getElementById('vs').textContent='Score : '+score;
  var fb=document.getElementById('vfb');fb.className='fb '+(ok?'ok':'ko');
  document.getElementById('vfbh').textContent=ok?'Correct !':'Faux !';
  document.getElementById('vfbb').textContent=ok?q.good:q.bad;
  document.getElementById('vfbr').textContent=q.ref;
  document.getElementById('vnxt').classList.add('show');
  document.getElementById('vnxt').textContent=(vi+1>=VF.length)?'Voir l\'exercice suivant':'Suivant';
}
function nextVF(){vi++;if(vi>=VF.length)showCover(2);else renderVF();}

function shuffle(arr){return arr.slice().sort(function(){return Math.random()-.5;});}

function renderID(){
  var qi2=idOrder[ii];var q=ID_Q[qi2];
  var tot=ID_Q.length;
  document.getElementById('idn').textContent='Feu '+(ii+1)+'/'+tot;
  document.getElementById('idf').style.width=(ii/tot*100)+'%';
  document.getElementById('id-view-lbl').textContent=q.img==='front'?'VUE AVANT':'VUE ARRIÈRE';
  var wrap=document.getElementById('car-wrap-id');wrap.innerHTML='';
  var img=document.createElement('img');
  img.className='car-img';img.src=IMG[q.img];img.alt='schéma véhicule';
  wrap.appendChild(img);
  var dot=document.createElement('div');dot.className='hot-dot';
  dot.style.left=q.dot.x+'%';dot.style.top=q.dot.y+'%';
  wrap.appendChild(dot);
  var pool=q.img==='front'?FRONT_LABELS:REAR_LABELS;
  var wrong=shuffle(pool.filter(function(l){return l!==q.label;})).slice(0,3);
  var choices=shuffle([q.label].concat(wrong));
  document.getElementById('idfb').className='fb';
  document.getElementById('idnxt').classList.remove('show');
  var w=document.getElementById('idch');w.innerHTML='';
  choices.forEach(function(c){
    var b=document.createElement('button');b.className='id-choice';b.textContent=c;
    b.onclick=function(){ansID(c,q);};w.appendChild(b);
  });
}
function ansID(chosen,q){
  var ok=chosen===q.label;
  document.querySelectorAll('.id-choice').forEach(function(b){
    b.disabled=true;if(b.textContent===q.label)b.classList.add('ok');
    else if(b.textContent===chosen&&!ok)b.classList.add('ko');
  });
  if(ok){score++;correct++;}total++;
  document.getElementById('ids').textContent='Score : '+score;
  var fb=document.getElementById('idfb');fb.className='fb '+(ok?'ok':'ko');
  document.getElementById('idfbh').textContent=ok?'Correct !':'Pas tout à fait...';
  document.getElementById('idfbb').textContent=q.expl;
  document.getElementById('idfbr').textContent=q.ref;
  document.getElementById('idnxt').classList.add('show');
  document.getElementById('idnxt').textContent=(ii+1>=ID_Q.length)?'Voir les résultats':'Feu suivant';
}
function nextID(){ii++;if(ii>=ID_Q.length)showResults();else renderID();}

function showResults(){
  var tot=QCM.length+VF.length+ID_Q.length;
  var pct=Math.round(correct/tot*100);
  document.getElementById('rn').textContent=correct+'/'+tot;
  document.getElementById('rok').textContent=correct;
  document.getElementById('rko').textContent=tot-correct;
  document.getElementById('rpc').textContent=pct+'%';
  var icon,title,bclass,btxt,msg;
  if(pct>=90){icon='A+';title='EXPERT';bclass='bg';btxt='Expert';msg='Excellent ! Vous maîtrisez parfaitement la réglementation sur l\'éclairage.';}
  else if(pct>=70){icon='B';title='BON NIVEAU';bclass='bs';btxt='Bon niveau';msg='Bon résultat. Quelques points à consolider avant l\'examen.';}
  else if(pct>=50){icon='C';title='À RÉVISER';bclass='bb';btxt='En progression';msg='Résultat moyen. Relisez l\'OCR art. 29 et l\'OETV art. 72–79.';}
  else{icon='D';title='INSUFFISANT';bclass='br';btxt='À améliorer';msg='Révision sérieuse nécessaire. Reprenez le cours sur l\'éclairage.';}
  document.getElementById('ri').textContent=icon;
  document.getElementById('rt').textContent=title;
  var b=document.getElementById('rb');b.className='badge '+bclass;b.textContent=btxt;
  document.getElementById('rm').textContent=msg;
  show('p-results');
}

</script>
</body>
</html>
